name: Terraform Dev Deployment (GCP + BindPlane)

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TF_IN_AUTOMATION: true

      # ==========================
      # BindPlane (provider expects these via vars)
      # ==========================
      TF_VAR_bindplane_remote_url: ${{ secrets.BINDPLANE_REMOTE_URL }}
      TF_VAR_bindplane_api_key: ${{ secrets.BINDPLANE_API_KEY }}

      # ==========================
      # GCP
      # ==========================
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ secrets.GCP_REGION }}
      TF_VAR_zone: ${{ secrets.GCP_ZONE }}

    steps:
      # ----------------------------
      # Checkout
      # ----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------
      # Authenticate to GCP (OIDC)
      # ----------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/424275822356/locations/global/workloadIdentityPools/github-actions-pool/providers/github"
          service_account: "bindplane-service@applied-polymer-479818-t7.iam.gserviceaccount.com"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # ----------------------------
      # Setup Terraform
      # ----------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.2

      # ----------------------------
      # Terraform (RUN FROM ROOT)
      # ----------------------------
      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
